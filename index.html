x:1;text-align:center;font-size:10px;min-width:30px}.pair{height:140px;display:flex;align-items:end;justify-content:center;gap:3px}.pair i{width:35%;background:#40846c;border-radius:4px 4px 0 0}.pair i.out{background:#d3a269}.search{min-width:220px}details{margin:16px 0;line-height:1.8}summary{cursor:pointer;font-weight:650}@media(max-width:1050px){main{padding:24px;margin-left:195px}aside{width:195px}.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:650px){aside{position:static;width:auto;padding:18px}.brand{font-size:20px}.brand small,aside footer{display:none}nav{display:flex;overflow:auto;margin-top:14px;gap:3px}nav button{padding:9px;white-space:nowrap;font-size:12px}main{margin:0;padding:20px 14px}.top{align-items:start}h1{font-size:27px}.metric{padding:16px}.metric strong{font-size:24px}.metrics{gap:10px;margin:20px 0}.panel{padding:16px}.fields{grid-template-columns:1fr}.chartrow{grid-template-columns:110px 1fr 80px;gap:7px}.actions button{font-size:13px}.trend{overflow:auto}}

pt>
'use strict';
const KEY='taylor-made-budget-v1',ATB='unassigned';
const defaults=[['Everyday','Groceries',0],['Everyday','Dining Out',0],['Everyday','Transportation',0],['Bills','Utilities',0],['Bills','Insurance',0],['Savings','Emergency Fund',0]];
function fresh(){return{version:1,categories:defaults.map((c,i)=>({id:'c'+i,group:c[0],name:c[1],target:c[2]*100,goal:(c[3]||0)*100})),accounts:[{id:'checking',name:'Checking',type:'cash'},{id:'card',name:'Credit Card',type:'credit'}],transactions:[],allocations:[],networth:[]}}
let offlineStatus='Offline setup is pending. Open the app online to prepare it.',installPrompt=null;
let db=fresh(),page='budget',query='',accountFilter='';try{const raw=localStorage.getItem(KEY);if(raw){db=JSON.parse(raw);validate(db)}}catch(e){alert('Saved data could not be loaded. Use a backup to restore it. The stored copy has not been overwritten.');}
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format((n||0)/100),id=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2),today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
$('month').value=today().slice(0,7);const month=()=>$('month').value,end=()=>month()+'-31',date=()=>today().startsWith(month())?today():month()+'-01';
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));render();toast('Saved on this browser')}catch(e){alert('Unable to save. Export a backup now; browser storage may be full or disabled.')}}function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}
const cname=c=>c===ATB?'Available to budget':db.categories.find(x=>x.id===c)?.name||'Unknown category',aname=a=>db.accounts.find(x=>x.id===a)?.name||'Unknown account';
function accountBalance(a,cut=end(),cleared=false){return db.transactions.filter(t=>t.date<=cut&&(!cleared||t.status==='cleared')).reduce((n,t)=>n+(t.account===a?t.amount:0)+(t.to===a?-t.amount:0),0)}
function catBalance(c,cut=end()){return db.transactions.filter(t=>t.date<=cut&&t.category===c&&t.type!=='transfer').reduce((n,t)=>n+t.amount,0)+db.allocations.filter(t=>t.date<=cut).reduce((n,t)=>n+(t.to===c?t.amount:0)-(t.from===c?t.amount:0),0)}
function monthTx(m=month()){return db.transactions.filter(t=>t.date.startsWith(m))}function totals(m=month()){let ts=monthTx(m);return{income:ts.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0),spent:-ts.filter(t=>t.type==='expense'||t.type==='refund').reduce((a,t)=>a+t.amount,0)}}
function budgeted(c,m=month()){return db.allocations.filter(t=>t.date.startsWith(m)).reduce((n,t)=>n+(t.to===c?t.amount:0)-(t.from===c?t.amount:0),0)}
function activity(c,m=month()){return monthTx(m).filter(t=>t.category===c&&t.type!=='transfer').reduce((n,t)=>n+t.amount,0)}
function metric(label,value,sub,hero=false){return `<div class="metric ${hero?'hero':''}"><div class="eyebrow">${label}</div><strong class="${value<0?'negative':''}">${money(value)}</strong><span>${sub}</span></div>`}
function render(){const tabs={budget:'Budget',transactions:'Transactions',accounts:'Accounts',reports:'Reports',networth:'Net worth',settings:'Settings'};$('nav').innerHTML=Object.entries(tabs).map(([k,v])=>`<button data-page="${k}" class="${page===k?'active':''}">${v}</button>`).join('');$('heading').textContent={budget:'Monthly budget',transactions:'Your transactions',accounts:'Accounts & balances',reports:'Spending & trends',networth:'Net worth',settings:'Make it yours'}[page];$('view').innerHTML=views[page]();}
function budgetView(){let {income,spent}=totals(),balance=db.accounts.reduce((n,a)=>n+accountBalance(a.id),0),groups=[...new Set(db.categories.map(c=>c.group))];return `${!db.transactions.length?'<div class="note" style="margin-top:20px"><b>Start your standalone budget</b><br>Add or edit your accounts, set category targets in Settings, then record income and assign it to envelopes. No spreadsheet or import needed. <button class="small" data-page="accounts">Set up accounts</button> <button class="small" data-page="settings">Set up categories</button></div>':''}<div class="metrics">${metric('Available to budget',catBalance(ATB),'Money still waiting for a job',true)}${metric('Income this month',income,'Recorded income')}${metric('Spent this month',spent,'Expenses less refunds')}${metric('Account total',balance,'Includes pending transactions')}</div><div class="grid"><section class="panel"><div class="panelhead"><h2>Your envelopes</h2><button data-action="allocate">Move money</button></div><div class="scroll"><table><thead><tr><th>Category</th><th class="num">Assigned</th><th class="num">Activity</th><th class="num">Available</th><th></th></tr></thead><tbody>${groups.map(g=>`<tr class="group"><td colspan="5">${esc(g)}</td></tr>`+db.categories.filter(c=>c.group===g).map(c=>{let b=catBalance(c.id);return `<tr><td>${esc(c.name)}<div class="sub">Target ${money(c.target)}${c.goal?' · Goal '+money(c.goal):''}</div><div class="bar"><i style="width:${Math.max(0,Math.min(100,b/(c.goal||c.target||1)*100))}%"></i></div></td><td class="num">${money(budgeted(c.id))}</td><td class="num">${money(activity(c.id))}</td><td class="num ${b<0?'negative':''}"><b>${money(b)}</b></td><td><button class="small" data-action="fund" data-id="${c.id}" aria-label="Assign money to ${esc(c.name)}">+</button></td></tr>`}).join('')).join('')}</tbody></table></div></section><div><section class="panel"><div class="panelhead"><h2>Accounts</h2><button class="small" data-action="account">+ Add account</button></div>${db.accounts.map(a=>`<div class="account"><span>${esc(a.name)}<div class="sub">${a.type==='credit'?'Credit card':'Cash / bank'}</div></span><b>${money(accountBalance(a.id))}</b></div>`).join('')}<p class="sub">Balances through the selected month. Card debt is negative.</p></section><section class="panel"><h2>A little direction</h2><p>1. Add your accounts and opening balances.</p><p>2. Move available money into envelopes.</p><p>3. Record spending as it happens.</p><p>Envelope balances roll into the next month, including overspending.</p><button data-page="settings">Backup & setup</button></section></div></div>`}
function transactionView(){const ts=monthTx().filter(t=>(!accountFilter||t.account===accountFilter||t.to===accountFilter)&&`${t.memo} ${aname(t.account)} ${cname(t.category)}`.toLowerCase().includes(query.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="panel" style="margin-top:26px"><div class="panelhead"><input class="search" id="search" aria-label="Search transactions" placeholder="Search transactions…" value="${esc(query)}"><select id="accountfilter" aria-label="Filter account"><option value="">All accounts</option>${db.accounts.map(a=>`<option value="${a.id}" ${a.id===accountFilter?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div><div class="scroll"><table><thead><tr><th>Date</th><th>Payee / memo</th><th>Category</th><th>Account</th><th>Status</th><th class="num">Amount</th><th></th></tr></thead><tbody>${ts.map(t=>`<tr><td>${t.date}</td><td>${esc(t.memo||t.type)}</td><td>${t.type==='transfer'?'Account transfer → '+esc(aname(t.to)):esc(cname(t.category))}</td><td>${esc(aname(t.account))}</td><td><button class="small" data-action="clear" data-id="${t.id}">${t.status==='cleared'?'✓ Cleared':'Pending'}</button></td><td class="num ${t.amount<0?'negative':''}">${money(t.amount)}</td><td><button class="small" data-action="editTx" data-id="${t.id}">Edit</button> <button class="small danger" data-action="deleteTx" data-id="${t.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No transactions this month. Add income, an expense, or an account transfer.</td></tr>'}</tbody></table></div><button style="margin-top:18px" data-action="csv">Export this month as CSV</button></div><section class="panel"><h2>Envelope transfers this month</h2><div class="scroll"><table><thead><tr><th>Date</th><th>From</th><th>To</th><th class="num">Amount</th><th></th></tr></thead><tbody>${db.allocations.filter(t=>t.date.startsWith(month())).map(t=>`<tr><td>${t.date}</td><td>${esc(cname(t.from))}</td><td>${esc(cname(t.to))}</td><td class="num">${money(t.amount)}</td><td><button class="small danger" data-action="deleteAllocation" data-id="${t.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No money assigned this month.</td></tr>'}</tbody></table></div></section>`}
function accountsView(){return `<div class="panel" style="margin-top:26px"><div class="panelhead"><h2>Account balances</h2><button data-action="account">+ Add account</button></div><div class="scroll"><table><thead><tr><th>Account</th><th class="num">Cleared</th><th class="num">Pending</th><th class="num">Total</th><th>Reconciled</th><th></th></tr></thead><tbody>${db.accounts.map(a=>`<tr><td>${esc(a.name)}<div class="sub">${a.type==='credit'?'Credit card':'Cash / bank'}</div></td><td class="num">${money(accountBalance(a.id,end(),true))}</td><td class="num">${money(accountBalance(a.id)-accountBalance(a.id,end(),true))}</td><td class="num">${money(accountBalance(a.id))}</td><td>${a.reconciled||'Not yet'}</td><td><button class="small" data-action="reconcile" data-id="${a.id}">Reconcile</button> <button class="small" data-action="editAccount" data-id="${a.id}">Edit</button></td></tr>`).join('')}</tbody></table></div></div><div class="note">Use a negative opening balance for credit card debt. Card purchases reduce the spending envelope; a card payment is an account transfer and does not count as another expense. Reconciliation compares your statement with cleared transactions.</div>`}
function reportsView(){const cs=db.categories.map(c=>({...c,spent:-activity(c.id)})).sort((a,b)=>b.spent-a.spent),max=Math.max(1,...cs.map(c=>c.spent)),ms=Array.from({length:12},(_,i)=>{let [y,m]=month().split('-').map(Number);return new Date(Date.UTC(y,m-12+i,1)).toISOString().slice(0,7)}),all=ms.map(m=>({m,...totals(m)})),peak=Math.max(1,...all.flatMap(t=>[t.income,t.spent])),t=totals();return `<div class="metrics">${metric('Income',t.income,'Selected month')}${metric('Expenses',t.spent,'Net of refunds')}${metric('Net income',t.income-t.spent,'Income minus expenses',true)}${metric('Monthly targets',db.categories.reduce((s,c)=>s+c.target,0),'Planned category contributions')}</div><section class="panel"><h2>Income & expenses · 12 months</h2><p class="sub">Green: income · Sand: expenses. Transfers and balance adjustments excluded.</p><div class="trend">${all.map(t=>`<div class="monthcol"><div class="pair"><i title="${t.m} income ${money(t.income)}" style="height:${Math.max(0,t.income)/peak*140}px"></i><i class="out" title="${t.m} expenses ${money(t.spent)}" style="height:${Math.max(0,t.spent)/peak*140}px"></i></div>${t.m.slice(2)}</div>`).join('')}</div><details><summary>View report values</summary><div class="scroll"><table><tr><th>Month</th><th>Income</th><th>Expenses</th><th>Net</th></tr>${all.map(t=>`<tr><td>${t.m}</td><td>${money(t.income)}</td><td>${money(t.spent)}</td><td>${money(t.income-t.spent)}</td></tr>`).join('')}</table></div></details></section><section class="panel"><h2>Spending by category</h2>${cs.filter(c=>c.spent!==0).map(c=>`<div class="chartrow"><span>${esc(c.name)}</span><div class="bar"><i style="width:${Math.max(0,c.spent)/max*100}%"></i></div><b class="num">${money(c.spent)}</b></div>`).join('')||'<p class="empty">Record expenses to see your spending breakdown.</p>'}</section>`}
function netSnapshot(cut){let latest={};db.networth.filter(n=>n.date<=cut).sort((a,b)=>a.date.localeCompare(b.date)).forEach(n=>latest[n.name]=n);return Object.values(latest)}
function netView(){let ns=netSnapshot(end()),assets=ns.filter(n=>n.type==='asset').reduce((s,n)=>s+n.amount,0),debts=ns.filter(n=>n.type==='debt').reduce((s,n)=>s+n.amount,0);return `<div class="metrics">${metric('Net worth',assets-debts,'Latest values through selected month',true)}${metric('Assets',assets,'Latest recorded asset values')}${metric('Debts',debts,'Latest recorded debt values')}</div><div class="note">Net worth is tracked separately from budget accounts. Add a dated value for each asset and debt; the latest value carries forward. Include checking and credit cards here if you want them counted. Enter zero when an asset is sold or debt is paid off.</div><section class="panel"><div class="panelhead"><h2>Asset & debt history</h2><button data-action="net">+ Record value</button></div><div class="scroll"><table><thead><tr><th>Date</th><th>Asset / debt</th><th>Type</th><th class="num">Value</th><th></th></tr></thead><tbody>${db.networth.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(n=>`<tr><td>${n.date}</td><td>${esc(n.name)}</td><td>${n.type}</td><td class="num">${money(n.amount)}</td><td><button class="small" data-action="editNet" data-id="${n.id}">Edit</button> <button class="small danger" data-action="deleteNet" data-id="${n.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Record your first asset or debt. No spreadsheet is needed.</td></tr>'}</tbody></table></div></section>`}
function settingsView(){return `<section class="panel" style="margin-top:26px"><h2>Use Taylor Made Budget as an app</h2><p>Install it from your browser to open it in its own window. After the first online visit and offline setup completes, you can use it without an internet connection.</p><button data-action="install">Install / app instructions</button><p class="sub" id="offlineStatus">${esc(offlineStatus)}</p><p class="sub">Your budget remains on this device and browser. Installation does not create cloud sync. Export a backup before changing devices or browsers.</p></section><section class="panel" style="margin-top:26px"><h2>Your data stays with you</h2><p>Data is saved in this browser on this device. There is no bank connection, account login, or automatic device sync. Clearing browser data can erase your budget. Export backups regularly and restore them on another device when needed.</p><div class="actions"><button class="primary" data-action="backup">Export backup</button><button data-action="restore">Restore app backup</button></div><details><summary>Start your budget here</summary>Add bank and credit card accounts with their opening balances, customize your categories below, then assign money and record transactions. Everything runs inside this app; no workbook, spreadsheet account, or import is required. Existing budgets and compatible JSON backups still work.</details></section><section class="panel"><div class="panelhead"><h2>Categories & goals</h2><button data-action="category">+ Category</button></div><div class="scroll"><table><thead><tr><th>Group</th><th>Category</th><th class="num">Monthly target</th><th class="num">Goal</th><th></th></tr></thead><tbody>${db.categories.map(c=>`<tr><td>${esc(c.group)}</td><td>${esc(c.name)}</td><td class="num">${money(c.target)}</td><td class="num">${money(c.goal)}</td><td><button class="small" data-action="editCategory" data-id="${c.id}">Edit</button> <button class="small danger" data-action="deleteCategory" data-id="${c.id}">Delete</button></td></tr>`).join('')}</tbody></table></div></section><section class="panel"><h2>How the budget works</h2><p>Targets are planning guides. Assigning money moves it from Available to budget into an envelope. Refunds return money to the original spending category. Opening balances and reconciliation adjustments affect Available to budget but are excluded from income reports. All calculations include pending transactions unless specifically labeled cleared.</p><p>All balances, envelope calculations, reports, and net-worth history are managed inside Taylor Made Budget.</p></section>`}
const views={budget:budgetView,transactions:transactionView,accounts:accountsView,reports:reportsView,networth:netView,settings:settingsView};
function field(name,label,value='',type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`}function select(name,label,options,value){return `<label>${label}<select name="${name}">${options.map(([k,v])=>`<option value="${esc(k)}" ${k===value?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`}const catOptions=()=>db.categories.map(c=>[c.id,c.name]),accOptions=()=>db.accounts.map(a=>[a.id,a.name]);
function modal(title,html,submit){$('dialogtitle').textContent=title;$('fields').innerHTML=html;$('form').onsubmit=e=>{e.preventDefault();try{submit(Object.fromEntries(new FormData(e.target)));$('dialog').close();save()}catch(err){alert(err.message)}};$('dialog').showModal()}
function cents(v){let n=Number(v);if(!Number.isFinite(n)||Math.abs(n)>1e12)throw Error('Enter a valid amount.');return Math.round(n*100)}
function txModal(existing){let t=existing||{date:date(),type:'expense',account:db.accounts[0]?.id,category:db.categories[0]?.id,status:'cleared',amount:0};modal(existing?'Edit transaction':'Add transaction',field('date','Date',t.date,'date','required')+select('type','Type',[['expense','Expense'],['income','Income'],['refund','Refund'],['transfer','Account transfer / card payment'],['adjustment','Opening balance / adjustment']],t.type)+field('amount','Amount ($)',existing?((t.type==='expense'||t.type==='transfer'?-t.amount:t.amount)/100):'','number','step="0.01" required')+select('account','Account',accOptions(),t.account)+select('category','Spending category',catOptions(),t.category)+select('to','Destination account (transfers only)',accOptions(),t.to)+field('memo','Payee / memo',t.memo||'')+select('status','Status',[['cleared','Cleared'],['pending','Pending']],t.status),v=>{let amount=cents(v.amount);if(v.type!=='adjustment'&&amount<=0)throw Error('Amount must be greater than zero.');if(v.type==='transfer'&&v.account===v.to)throw Error('Choose two different accounts.');let n={id:t.id||id(),date:v.date,type:v.type,account:v.account,status:v.status,memo:v.memo,amount:['expense','transfer'].includes(v.type)?-amount:amount};if(v.type==='transfer')n.to=v.to;else n.category=['income','adjustment'].includes(v.type)?ATB:v.category;if(existing)db.transactions=db.transactions.map(x=>x.id===t.id?n:x);else db.transactions.push(n)});const type=$('form').elements.type;function toggle(){const v=type.value;$('form').elements.category.parentElement.hidden=!['expense','refund'].includes(v);$('form').elements.to.parentElement.hidden=v!=='transfer';$('form').elements.amount.min=v==='adjustment'?'':'0.01'}type.onchange=toggle;toggle()}
function allocate(c){modal('Move money between envelopes',field('date','Date',date(),'date','required')+field('amount','Amount ($)','','number','min="0.01" step="0.01" required')+select('from','From',[[ATB,'Available to budget'],...catOptions()],ATB)+select('to','To',[[ATB,'Available to budget'],...catOptions()],c||db.categories[0]?.id),v=>{let n=cents(v.amount);if(v.from===v.to)throw Error('Choose two different categories.');if(n<=0)throw Error('Enter a positive amount.');if(n>catBalance(v.from,v.date)&&!confirm('This assignment exceeds the available balance. Assign anyway?'))throw Error('Assignment cancelled.');db.allocations.push({id:id(),date:v.date,amount:n,from:v.from,to:v.to})})}
function categoryModal(c){modal(c?'Edit category':'Add category',field('name','Category',c?.name||'','text','required maxlength="100"')+field('group','Group',c?.group||'Expenses','text','required maxlength="100"')+field('target','Monthly target ($)',(c?.target||0)/100,'number','min="0" step="0.01" required')+field('goal','Goal ($)',(c?.goal||0)/100,'number','min="0" step="0.01" required'),v=>{if(db.categories.some(x=>x.id!==c?.id&&x.name.toLowerCase()===v.name.trim().toLowerCase()))throw Error('A category already has that name.');let n={id:c?.id||id(),name:v.name.trim(),group:v.group.trim(),target:cents(v.target),goal:cents(v.goal)};if(!n.name||!n.group)throw Error('Enter a name and group.');if(c)Object.assign(c,n);else db.categories.push(n)})}
function accountModal(a){modal(a?'Edit account':'Add account',field('name','Account name',a?.name||'','text','required maxlength="100" placeholder="e.g. Chase checking or Visa"')+select('type','Account type',[['cash','Bank account / cash'],['credit','Credit card']],a?.type||'cash')+(!a?field('balance','Opening balance ($, negative for debt)',0,'number','step="0.01" required')+field('date','Opening date',date(),'date','required'):''),v=>{if(!v.name.trim())throw Error('Enter an account name.');if(db.accounts.some(x=>x.id!==a?.id&&x.name.toLowerCase()===v.name.trim().toLowerCase()))throw Error('An account already has that name.');if(a){a.name=v.name.trim();a.type=v.type}else{let aid=id();db.accounts.push({id:aid,name:v.name.trim(),type:v.type});let amount=cents(v.balance);if(amount)db.transactions.push({id:id(),date:v.date,type:'adjustment',account:aid,category:ATB,amount,memo:'Opening balance',status:'cleared'})}})}
function reconcile(a){modal('Reconcile '+a.name,field('date','Statement date',date(),'date','required')+field('balance','Cleared statement balance ($)',accountBalance(a.id,date(),true)/100,'number','step="0.01" required')+'<p class="full sub">Mark cleared transactions first. A difference creates a balance adjustment in Available to budget.</p>',v=>{let diff=cents(v.balance)-accountBalance(a.id,v.date,true);if(diff&&!confirm('Record a balance adjustment of '+money(diff)+'?'))throw Error('Reconciliation cancelled.');if(diff)db.transactions.push({id:id(),date:v.date,type:'adjustment',account:a.id,category:ATB,amount:diff,status:'cleared',memo:'Reconciliation adjustment'});a.reconciled=v.date})}
function netModal(n){modal(n?'Edit net-worth value':'Record net-worth value',field('date','Date',n?.date||date(),'date','required')+field('name','Asset / debt name',n?.name||'','text','required maxlength="100" list="netnames"')+`<datalist id="netnames">${[...new Set(db.networth.map(x=>x.name))].map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`+select('type','Type',[['asset','Asset'],['debt','Debt']],n?.type||'asset')+field('amount','Value ($)',(n?.amount||0)/100,'number','min="0" step="0.01" required'),v=>{if(!v.name.trim())throw Error('Enter an asset or debt name.');if(db.networth.some(x=>x.id!==n?.id&&x.name===v.name.trim()&&x.date===v.date))throw Error('A value already exists for this name and date. Edit that entry.');let a={id:n?.id||id(),date:v.date,name:v.name.trim(),type:v.type,amount:cents(v.amount)};if(n)Object.assign(n,a);else db.networth.push(a)})}
function download(name,text,type='application/json'){let u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function validate(d){if(d.version!==1)throw Error('Unsupported backup version.');for(let k of ['categories','accounts','transactions','allocations','networth']){if(!Array.isArray(d[k]))throw Error('Invalid '+k);let ids=new Set();for(let r of d[k]){if(!r||typeof r.id!=='string'||!/^[\w-]+$/.test(r.id)||ids.has(r.id))throw Error('Invalid or duplicate record ID');ids.add(r.id)}}if(!d.accounts.length||!d.categories.length)throw Error('Backup requires accounts and categories.');const str=(s)=>typeof s==='string'&&s.length<=500,amt=n=>Number.isSafeInteger(n)&&Math.abs(n)<=1e14,dt=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(Date.parse(s)),cat=c=>c===ATB||d.categories.some(x=>x.id===c),acc=a=>d.accounts.some(x=>x.id===a);for(let c of d.categories)if(!str(c.name)||!str(c.group)||!amt(c.target)||!amt(c.goal)||c.target<0||c.goal<0)throw Error('Invalid category');for(let a of d.accounts)if(!str(a.name)||!['cash','credit'].includes(a.type))throw Error('Invalid account');for(let t of d.transactions)if(!dt(t.date)||!amt(t.amount)||!acc(t.account)||!str(t.memo)||!['cleared','pending'].includes(t.status)||!['expense','refund','income','adjustment','transfer'].includes(t.type)||(t.type==='transfer'?(!acc(t.to)||t.to===t.account):!cat(t.category)))throw Error('Invalid transaction');for(let t of d.allocations)if(!dt(t.date)||!amt(t.amount)||t.amount<=0||!cat(t.from)||!cat(t.to)||t.from===t.to)throw Error('Invalid allocation');for(let n of d.networth)if(!dt(n.date)||!str(n.name)||!amt(n.amount)||n.amount<0||!['asset','debt'].includes(n.type))throw Error('Invalid net-worth entry')}
const actions={install:async()=>{if(installPrompt){const prompt=installPrompt;installPrompt=null;await prompt.prompt();}else{alert('Android / Chrome: open the browser menu and choose Install app or Add to Home screen.\n\niPhone / iPad / Safari: use Share, then Add to Home Screen.\n\nDesktop Chrome / Edge: use the install icon in the address bar or the browser menu.\n\nIf already installed, open Taylor Made Budget from your apps.');}},fund:allocate,allocate:()=>allocate(),category:()=>categoryModal(),editCategory:i=>categoryModal(db.categories.find(x=>x.id===i)),account:()=>accountModal(),editAccount:i=>accountModal(db.accounts.find(x=>x.id===i)),reconcile:i=>reconcile(db.accounts.find(x=>x.id===i)),editTx:i=>txModal(db.transactions.find(x=>x.id===i)),clear:i=>{let t=db.transactions.find(x=>x.id===i);t.status=t.status==='cleared'?'pending':'cleared';save()},deleteTx:i=>{if(confirm('Delete this transaction?')){db.transactions=db.transactions.filter(t=>t.id!==i);save()}},deleteAllocation:i=>{if(confirm('Delete this envelope transfer?')){db.allocations=db.allocations.filter(t=>t.id!==i);save()}},deleteCategory:i=>{if(db.transactions.some(t=>t.category===i)||db.allocations.some(t=>t.from===i||t.to===i))return alert('This category has history and cannot be deleted. Rename it instead.');if(db.categories.length===1)return alert('Keep at least one category.');if(confirm('Delete this unused category?')){db.categories=db.categories.filter(c=>c.id!==i);save()}},net:()=>netModal(),editNet:i=>netModal(db.networth.find(x=>x.id===i)),deleteNet:i=>{if(confirm('Delete this recorded value?')){db.networth=db.networth.filter(n=>n.id!==i);save()}},backup:()=>download('Taylor-Made-Budget-'+today()+'.json',JSON.stringify(db,null,2)),restore:()=>$('restore').click(),csv:()=>{let rows=[['Date','Type','Account','Category / destination','Memo','Amount','Status'],...monthTx().map(t=>[t.date,t.type,aname(t.account),t.type==='transfer'?aname(t.to):cname(t.category),t.memo,(t.amount/100).toFixed(2),t.status])];download('Transactions-'+month()+'.csv',rows.map(r=>r.map(v=>'"'+String(v).replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"').join(',')).join('\r\n'),'text/csv')}};
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render()}if(b.dataset.action)actions[b.dataset.action](b.dataset.id)});document.addEventListener('change',e=>{if(e.target.id==='accountfilter'){accountFilter=e.target.value;render()}});document.addEventListener('input',e=>{if(e.target.id==='search'){let pos=e.target.selectionStart;query=e.target.value;render();$('search').focus();$('search').setSelectionRange(pos,pos)}});$('month').onchange=()=>{if(!month())$('month').value=today().slice(0,7);render()};$('add').onclick=()=>txModal();$('cancel').onclick=()=>$('dialog').close();$('restore').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let imported=JSON.parse(await f.text());validate(imported);if(confirm('Replace this browser’s budget with '+f.name+'? Export a backup first if needed.')){localStorage.setItem(KEY,JSON.stringify(imported));db=imported;render();toast('Import complete')}}catch(err){alert('Import failed: '+err.message)}e.target.value=''};render();
